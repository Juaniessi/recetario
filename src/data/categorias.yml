# Árbol de categorías del recetario, por tipo de comida.
#
# - Las ramas grandes se ven siempre en el inicio, aunque no tengan recetas.
# - Las sub-ramas aparecen solas cuando alguna receta las usa.
# - Una receta las nombra por su id: "helados" o "helados/paletas".
#   Puede nombrar varias.
# - principal: true la pone arriba de todo, junto a «Todas las recetas».
#   Las demás quedan abajo, en «Más categorías».
# - color: verde, amarillo, naranja, violeta, indigo o celeste.
# - Para sumar una rama o una sub-rama, se agrega acá y listo.

- id: comidas-principales
  principal: true
  color: verde
  nombre: Comidas principales
  aclaracion: almuerzo y cena
  sub:
    - id: carnes
      nombre: Carnes
    - id: guisos-y-ollas
      nombre: Guisos y ollas
    - id: pastas
      nombre: Pastas
    - id: verduras
      nombre: Verduras

- id: panes-y-masas
  color: amarillo
  nombre: Panes y masas
  sub:
    - id: panes
      nombre: Panes
    - id: tortillas
      nombre: Tortillas

- id: desayuno-y-merienda
  color: naranja
  nombre: Desayuno y merienda
  sub:
    - id: waffles
      nombre: Waffles

- id: postres-y-pasteleria
  principal: true
  color: violeta
  nombre: Postres y pastelería
  sub:
    - id: tortas-budines-y-brownies
      nombre: Tortas, budines y brownies
    - id: chocolate
      nombre: Chocolate

- id: helados
  color: celeste
  nombre: Helados
  sub:
    - id: paletas
      nombre: Paletas

- id: basicos
  color: indigo
  nombre: Básicos
  aclaracion: se usan en otras recetas
